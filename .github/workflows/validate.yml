name: Validate Contributor Card

on:
  pull_request:
    branches: [main]
    paths:
      - 'cards/**'
      - 'schema/**'
      - 'scripts/**'
  push:
    branches: [main]

jobs:
  validate:
    name: Schema & Card Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run PR boundary check
        if: github.event_name == 'pull_request'
        env:
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          GITHUB_BASE_REF: ${{ github.base_ref }}
        run: node scripts/validate-pr.js

      - name: Validate Cards against Schema
        run: node scripts/validate-cards.js

      - name: Test Build Site
        run: |
          cd site
          npm ci || npm install
          npm run build
